<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | SPM TOP AGENCY</title>

<meta name="theme-color" content="#00d4ff">

<link rel="icon" href="assets/favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#05060f;
color:#fff;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

background-image:
radial-gradient(circle at top,#0f1b35,#05060f);

}

.box{

text-align:center;

padding:45px;

max-width:600px;

width:92%;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

border-radius:24px;

backdrop-filter:blur(12px);

box-shadow:0 20px 60px rgba(0,212,255,.12);

}

h1{

font-size:110px;

color:#00d4ff;

margin-bottom:15px;

}

h2{

font-size:32px;

margin-bottom:15px;

}

p{

color:#cbd5e1;

line-height:1.8;

margin-bottom:30px;

}

a{

display:inline-block;

padding:15px 35px;

background:linear-gradient(135deg,#00d4ff,#6c63ff);

color:#fff;

text-decoration:none;

border-radius:50px;

font-weight:bold;

transition:.3s;

}

a:hover{

transform:translateY(-4px);

box-shadow:0 12px 35px rgba(0,212,255,.3);

}

</style>

</head>

<body>

<div class="box">

<h1>404</h1>

<h2>Page Not Found</h2>

<p>
Sorry, the page you are looking for doesn't exist or has been moved.
</p>

<a href="./index.html">
🏠 Back to Home
</a>

</div>

</body>

</html>
