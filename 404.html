<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>404 | SPM TOP AGENCY</title>

<meta name="theme-color"

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#070b15;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
color:white;
text-align:center;

}

body::before{

content:"";
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#FFD70033,transparent 70%);
animation:rotateGlow 12s linear infinite;

}

@keyframes rotateGlow{

100%{

transform:rotate(360deg);

}

}

.card{

position:relative;
z-index:2;
padding:45px;
width:90%;
max-width:550px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
backdrop-filter:blur(18px);

}

h1{

font-size:110px;
color:#FFD700;
margin-bottom:10px;

}

h2{

font-size:32px;
margin-bottom:15px;

}

p{

color:#cccccc;
line-height:1.8;
margin-bottom:35px;

}

.btn{

display:inline-block;
padding:15px 35px;
border-radius:50px;
background:#FFD700;
color:#111;
text-decoration:none;
font-weight:700;
transition:.3s;

}

.btn:hover{

transform:translateY(-4px);

}

.footer{

margin-top:30px;
font-size:14px;
color:#888;

}

</style>

</head>

<body>

<div class="card">

<h1>404</h1>

<h2>Page Not Found</h2>

<p>

The page you're looking for doesn't exist or has been moved.

</p>

<a href="./index.html"
class="btn">

🏠 Back To Home

</a>

<div class="footer">

<b>SPM TOP AGENCY</b><br>

Powered By <span style="color:#FFD700;">SPM AI</span>

</div>

</div>

</body>

</html>
