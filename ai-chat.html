<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPM AI Chat | SPM TOP AGENCY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 10%, rgba(139,92,246,.25), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(6,182,212,.18), transparent 30%),
        #070711;
    }

    .container {
      width: min(850px, 94%);
      margin: auto;
    }

    header {
      border-bottom: 1px solid rgba(255,255,255,.12);
      background: rgba(7,7,17,.85);
      backdrop-filter: blur(18px);
    }

    .nav {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(
        90deg,
        white,
        #fbbf24,
        #ec4899,
        #06b6d4
      );
      -webkit-background-clip: text;
      color: transparent;
    }

    .home {
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      color: #ddd;
      text-decoration: none;
      font-size: 13px;
    }

    .chat-wrapper {
      padding: 35px 0;
    }

    .chat-box {
      height: 720px;
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 26px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.13);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 100px rgba(0,0,0,.45);
    }

    .chat-header {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .ai-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 24px;
      background: linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899,
        #06b6d4
      );
      box-shadow: 0 0 30px rgba(139,92,246,.35);
    }

    .chat-title strong {
      display: block;
      font-size: 16px;
    }

    .online {
      color: #4ade80;
      font-size: 12px;
      margin-top: 4px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 82%;
      padding: 13px 15px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.55;
    }

    .bot {
      align-self: flex-start;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(
        100deg,
        #8b5cf6,
        #ec4899
      );
    }

    .quick-buttons {
      padding: 10px 18px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .quick-buttons button {
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.06);
      color: white;
      padding: 9px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
    }

    .input-area {
      padding: 15px;
      display: flex;
      gap: 9px;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: white;
      outline: none;
    }

    #sendButton {
      width: 52px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: linear-gradient(
        100deg,
        #8b5cf6,
        #ec4899
      );
      cursor: pointer;
      font-size: 18px;
    }

    .typing {
      color: #aaa;
      font-size: 12px;
      display: none;
    }

    @media (max-width: 600px) {
      .chat-wrapper {
        padding: 12px 0;
      }

      .chat-box {
        height: calc(100vh - 95px);
        border-radius: 20px;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">

    <div class="logo">
      SPM AI
    </div>

    <a href="index.html" class="home">
      ← Home
    </a>

  </div>
</header>


<main class="container chat-wrapper">

  <div class="chat-box">

    <div class="chat-header">

      <div class="ai-icon">
        🤖
      </div>

      <div class="chat-title">
        <strong>SPM AI Assistant</strong>
        <div class="online">
          ● Online • 24/7 Support
        </div>
      </div>

    </div>


    <div class="messages" id="messages">

      <div class="message bot">
        👋 Hi! I'm <strong>SPM AI</strong>.<br><br>

        I can help you with Coin Recharge,
        Paid Sending, Events and general SPM
        TOP AGENCY information.
        <br><br>
        Tusi Punjabi, Hindi ya English vich gal kar sakde ho. 😊
      </div>

    </div>


    <div class="quick-buttons">

      <button onclick="quickMessage('Coin Recharge rates')">
        💰 Coins
      </button>

      <button onclick="quickMessage('Paid Sending rates')">
        💸 Paid Sending
      </button>

      <button onclick="quickMessage('Events')">
        🎁 Events
      </button>

      <button onclick="quickMessage('Contact Admin')">
        📞 Admin
      </button>

    </div>


    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
        onkeydown="handleKey(event)"
      >

      <button id="sendButton" onclick="sendMessage()">
        ➤
      </button>

    </div>

  </div>

</main>


<script>

  const messages = document.getElementById("messages");
  const input = document.getElementById("messageInput");


  function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.innerHTML = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
  }


  function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    showBotReply(text);
  }


  function quickMessage(text) {

    addMessage(text, "user");

    showBotReply(text);
  }


  function handleKey(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  }


  function showBotReply(text) {

    const typing = document.createElement("div");

    typing.className = "message bot typing";

    typing.textContent = "SPM AI is typing...";

    typing.style.display = "block";

    messages.appendChild(typing);

    messages.scrollTop = messages.scrollHeight;


    setTimeout(() => {

      typing.remove();

      const reply = generateReply(text);

      addMessage(reply, "bot");

    }, 650);

  }


  function generateReply(text) {

    const message = text.toLowerCase();


    if (
      message.includes("coin") ||
      message.includes("recharge") ||
      message.includes("coins")
    ) {

      return `
        💰 <strong>Coin Recharge</strong><br><br>

        Available packages:<br>
        ₹100 → 1,260 Coins<br>
        ₹200 → 2,520 Coins<br>
        ₹300 → 3,780 Coins<br>
        ₹500 → 6,300 Coins<br>
        ₹1,000 → 12,600 Coins<br>
        ₹3,000 → 37,800 Coins<br>
        ₹5,000 → 63,000 Coins<br>
        ₹10,000 → 126,000 Coins<br>
        ₹20,000 → 252,000 Coins<br><br>

        👉 <a href="coins.html">Open Coin Recharge</a>
      `;

    }


    if (
      message.includes("paid") ||
      message.includes("sending") ||
      message.includes("10k") ||
      message.includes("100k")
    ) {

      return `
        💸 <strong>Paid Sending</strong><br><br>

        10,000 Coins → ₹600<br>
        100,000 Coins → ₹6,000<br><br>

        👉 <a href="paid-sending.html">
        Open Paid Sending
        </a>
      `;

    }


    if (
      message.includes("event") ||
      message.includes("offer")
    ) {

      return `
        🎁 <strong>SPM Events</strong><br><br>

        • Daily Recharge Event<br>
        • 200% Coins Level Up Event<br>
        • Future special events<br><br>

        👉 <a href="events.html">
        View Events
        </a>
      `;

    }


    if (
      message.includes("admin") ||
      message.includes("contact") ||
      message.includes("help")
    ) {

      return `
        📞 <strong>SPM Support</strong><br><br>

        Please contact SPM TOP AGENCY support
        for order-related assistance.
      `;

    }


    if (
      message.includes("hello") ||
      message.includes("hi") ||
      message.includes("sat sri akal") ||
      message.includes("ਸਤ ਸ੍ਰੀ ਅਕਾਲ")
    ) {

      return `
        👋 Hello! Welcome to <strong>SPM TOP AGENCY</strong>.<br><br>
        Main tuhanu Coin Recharge, Paid Sending
        te Events bare help kar sakda haan. 😊
      `;

    }


    return `
      🤖 Main tuhadi help kar sakda haan.<br><br>

      Try asking:<br>
      • Coin Recharge rates<br>
      • Paid Sending rates<br>
      • Events<br>
      • Contact Admin
    `;

  }

</script>

</body>
</html>
