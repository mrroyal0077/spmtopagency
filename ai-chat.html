<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPM AI Chat | SPM TOP AGENCY</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#05050b;
  --card:rgba(255,255,255,.065);
  --border:rgba(255,255,255,.12);
  --muted:#a7a7ba;
  --purple:#8b5cf6;
  --pink:#ec4899;
  --cyan:#06b6d4;
  --gold:#fbbf24;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 10% 10%,rgba(139,92,246,.22),transparent 28%),
    radial-gradient(circle at 90% 15%,rgba(6,182,212,.18),transparent 28%),
    radial-gradient(circle at 50% 90%,rgba(236,72,153,.12),transparent 32%),
    var(--bg);
}

a{
  color:#c4b5fd;
}

.container{
  width:min(900px,94%);
  margin:auto;
}

/* NAV */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(5,5,11,.80);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

.nav{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:900;
  background:linear-gradient(
    90deg,
    #fff,
    var(--gold),
    var(--pink),
    var(--cyan)
  );
  -webkit-background-clip:text;
  color:transparent;
}

.back{
  padding:10px 15px;
  border-radius:11px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.06);
  color:#fff;
  text-decoration:none;
  font-size:13px;
}

/* CHAT */

.chat-area{
  padding:28px 0;
}

.chat-box{
  height:calc(100vh - 125px);
  min-height:600px;
  display:flex;
  flex-direction:column;
  overflow:hidden;

  border-radius:26px;
  background:rgba(255,255,255,.055);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);

  box-shadow:0 25px 100px rgba(0,0,0,.45);
}

/* CHAT HEADER */

.chat-header{
  padding:18px 20px;
  display:flex;
  align-items:center;
  gap:13px;
  border-bottom:1px solid var(--border);
}

.ai-icon{
  width:48px;
  height:48px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;
  font-size:24px;

  background:linear-gradient(
    135deg,
    var(--purple),
    var(--pink),
    var(--cyan)
  );

  box-shadow:0 0 30px rgba(139,92,246,.35);
}

.chat-title strong{
  display:block;
  font-size:16px;
}

.online{
  margin-top:4px;
  color:#4ade80;
  font-size:12px;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.message{
  max-width:82%;
  padding:13px 15px;
  border-radius:17px;
  font-size:14px;
  line-height:1.6;
  word-wrap:break-word;
}

.bot{
  align-self:flex-start;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.08);
}

.user{
  align-self:flex-end;
  background:linear-gradient(
    100deg,
    var(--purple),
    var(--pink)
  );
}

.typing{
  color:#aaa;
  font-size:12px;
}

/* QUICK BUTTONS */

.quick{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px 15px;

  border-top:1px solid rgba(255,255,255,.08);
}

.quick button{
  white-space:nowrap;
  padding:9px 13px;

  border-radius:20px;
  border:1px solid var(--border);

  background:rgba(255,255,255,.055);
  color:#fff;

  cursor:pointer;
  font-size:12px;
}

.quick button:hover{
  background:rgba(255,255,255,.11);
}

/* INPUT */

.input-area{
  display:flex;
  gap:9px;
  padding:15px;

  border-top:1px solid var(--border);
}

#messageInput{
  flex:1;
  min-width:0;

  padding:14px;

  border-radius:14px;
  border:1px solid var(--border);

  background:rgba(255,255,255,.06);
  color:#fff;

  outline:none;
  font-size:14px;
}

#messageInput:focus{
  border-color:var(--purple);
}

#sendButton{
  width:52px;
  border:0;
  border-radius:14px;

  color:#fff;
  font-size:18px;

  cursor:pointer;

  background:linear-gradient(
    100deg,
    var(--purple),
    var(--pink)
  );
}

/* MOBILE */

@media(max-width:600px){

  .chat-area{
    padding:10px 0;
  }

  .chat-box{
    height:calc(100vh - 92px);
    min-height:0;
    border-radius:20px;
  }

  .message{
    max-width:90%;
  }

  .messages{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>

  <div class="container nav">

    <div class="logo">
      SPM AI
    </div>

    <a href="index.html" class="back">
      ← Home
    </a>

  </div>

</header>


<main class="container chat-area">

  <div class="chat-box">

    <!-- HEADER -->

    <div class="chat-header">

      <div class="ai-icon">
        🤖
      </div>

      <div class="chat-title">

        <strong>
          SPM AI Assistant
        </strong>

        <div class="online">
          ● Online • 24/7 Support
        </div>

      </div>

    </div>


    <!-- MESSAGES -->

    <div class="messages" id="messages">

      <div class="message bot">

        👋 Sat Sri Akal! Welcome to
        <strong>SPM TOP AGENCY</strong>.

        <br><br>

        Main tuhanu help kar sakda haan:

        <br><br>

        💰 Coin Recharge<br>
        💸 Paid Sending<br>
        🎁 Events<br>
        📞 Support

        <br><br>

        Tusi Punjabi, Hindi ya English
        vich message kar sakde ho. 😊

      </div>

    </div>


    <!-- QUICK QUESTIONS -->

    <div class="quick">

      <button onclick="quickMessage('Coin Recharge')">
        💰 Coins
      </button>

      <button onclick="quickMessage('Paid Sending')">
        💸 Paid Sending
      </button>

      <button onclick="quickMessage('Events')">
        🎁 Events
      </button>

      <button onclick="quickMessage('WhatsApp Support')">
        📞 Support
      </button>

    </div>


    <!-- INPUT -->

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</main>


<script>

const messages =
  document.getElementById("messages");

const input =
  document.getElementById("messageInput");


/* ADD MESSAGE */

function addMessage(text,type){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.innerHTML =
    text;

  messages.appendChild(message);

  messages.scrollTop =
    messages.scrollHeight;
}


/* SEND */

function sendMessage(){

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  addMessage(
    escapeHTML(text),
    "user"
  );

  input.value="";

  botReply(text);
}


/* QUICK */

function quickMessage(text){

  addMessage(
    escapeHTML(text),
    "user"
  );

  botReply(text);
}


/* ENTER */

input.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      sendMessage();
    }

  }
);


/* BOT */

function botReply(text){

  const typing =
    document.createElement("div");

  typing.className =
    "message bot typing";

  typing.textContent =
    "SPM AI is typing...";

  messages.appendChild(typing);

  messages.scrollTop =
    messages.scrollHeight;


  setTimeout(function(){

    typing.remove();

    addMessage(
      generateReply(text),
      "bot"
    );

  },650);

}


/* REPLIES */

function generateReply(text){

  const msg =
    text.toLowerCase();


  /* COINS */

  if(
    msg.includes("coin") ||
    msg.includes("recharge") ||
    msg.includes("coins")
  ){

    return `
      💰 <strong>Coin Recharge</strong>

      <br><br>

      ₹100 → 1,260 Coins<br>
      ₹200 → 2,520 Coins<br>
      ₹300 → 3,780 Coins<br>
      ₹500 → 6,300 Coins<br>
      ₹1,000 → 12,600 Coins<br>
      ₹3,000 → 37,800 Coins<br>
      ₹5,000 → 63,000 Coins<br>
      ₹10,000 → 126,000 Coins<br>
      ₹20,000 → 252,000 Coins

      <br><br>

      👉
      <a href="coins.html">
        Open Coin Recharge
      </a>
    `;
  }


  /* PAID SENDING */

  if(
    msg.includes("paid") ||
    msg.includes("sending") ||
    msg.includes("10k") ||
    msg.includes("100k")
  ){

    return `
      💸 <strong>Paid Sending</strong>

      <br><br>

      10,000 Coins → ₹600<br>
      100,000 Coins → ₹6,000

      <br><br>

      👉
      <a href="paid-sending.html">
        Open Paid Sending
      </a>
    `;
  }


  /* EVENTS */

  if(
    msg.includes("event") ||
    msg.includes("offer")
  ){

    return `
      🎁 <strong>SPM Events</strong>

      <br><br>

      🔥 Daily Recharge Event<br>
      🚀 200% Coins Level Up Event<br>
      👑 Future Special Events

      <br><br>

      👉
      <a href="events.html">
        View Events
      </a>
    `;
  }


  /* SUPPORT */

  if(
    msg.includes("support") ||
    msg.includes("contact") ||
    msg.includes("admin") ||
    msg.includes("whatsapp")
  ){

    return `
      📞 <strong>SPM Support</strong>

      <br><br>

      WhatsApp:
      <a
        href="https://wa.me/919329687975"
        target="_blank"
        rel="noopener"
      >
        +91 93296 87975
      </a>

      <br><br>

      👉 Tap the number to contact support.
    `;
  }


  /* GREETING */

  if(
    msg.includes("hi") ||
    msg.includes("hello") ||
    msg.includes("hey") ||
    msg.includes("sat sri akal") ||
    msg.includes("ਸਤ ਸ੍ਰੀ ਅਕਾਲ")
  ){

    return `
      👋 Sat Sri Akal!

      <br><br>

      Welcome to
      <strong>SPM TOP AGENCY</strong>.

      <br><br>

      Tusi Coins, Paid Sending,
      Events ya Support bare puch sakde ho. 😊
    `;
  }


  /* PUNJABI */

  if(
    msg.includes("ki haal") ||
    msg.includes("kive") ||
    msg.includes("kiven")
  ){

    return `
      😊 Main bilkul ready haan!

      <br><br>

      Tusi pucho:
      <br>
      💰 Coins rate<br>
      💸 Paid Sending rate<br>
      🎁 Events<br>
      📞 Support
    `;
  }


  /* DEFAULT */

  return `
    🤖 Main tuhadi help kar sakda haan.

    <br><br>

    Try asking:

    <br><br>

    💰 "Coin Recharge rate"<br>
    💸 "Paid Sending rate"<br>
    🎁 "Events"<br>
    📞 "Contact Support"
  `;
}


/* SECURITY */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;
}

</script>

</body>
</html>
