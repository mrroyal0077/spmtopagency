<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM AI 2050 - Interactive AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #030308;
            --card-bg: rgba(15, 15, 28, 0.9);
            --gold: #ffd700;
            --cyan: #00f3ff;
            --pink: #ff0055;
            --border-color: rgba(0, 243, 255, 0.3);
            --text-main: #ffffff;
            --text-sub: #b0b5d0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; height: 100vh; display: flex; flex-direction: column; }

        header {
            background: rgba(3, 3, 8, 0.95); backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            display: flex; justify-content: space-between; align-items: center; padding: 12px 5%;
        }

        .logo-text { 
            font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; 
            background: linear-gradient(45deg, var(--gold), var(--cyan), var(--pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #fff; text-decoration: none; font-family: 'Orbitron'; font-size: 0.9rem; font-weight: 600; transition: 0.3s; }
        .nav-links a:hover { color: var(--cyan); }

        /* Chat Container Layout */
        .chat-container {
            flex: 1; max-width: 800px; width: 100%; margin: 20px auto; padding: 20px;
            display: flex; flex-direction: column; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2); backdrop-filter: blur(15px);
        }

        .chat-header {
            display: flex; align-items: center; gap: 12px; padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 15px;
        }
        .chat-header h2 { font-family: 'Orbitron'; color: var(--cyan); font-size: 1.3rem; }
        .status-dot { width: 10px; height: 10px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 10px #00ff66; }

        .chat-box { flex: 1; overflow-y: auto; padding-right: 10px; display: flex; flex-direction: column; gap: 15px; }

        .msg { max-width: 80%; padding: 12px 18px; border-radius: 12px; font-size: 1rem; line-height: 1.4; font-weight: 500; }
        .bot-msg { background: rgba(0, 243, 255, 0.1); border: 1px solid var(--cyan); align-self: flex-start; color: #fff; border-top-left-radius: 0; }
        .user-msg { background: rgba(255, 215, 0, 0.15); border: 1px solid var(--gold); align-self: flex-end; color: var(--gold); border-top-right-radius: 0; }

        /* Quick Suggestions */
        .suggestions { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; margin-top: 10px; }
        .chip {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
            color: var(--text-sub); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;
            cursor: pointer; white-space: nowrap; transition: 0.3s; font-family: 'Orbitron';
        }
        .chip:hover { border-color: var(--cyan); color: var(--cyan); }

        /* Input Controls */
        .chat-input-box { display: flex; gap: 10px; margin-top: 10px; }
        .chat-input {
            flex: 1; padding: 12px 18px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color); border-radius: 10px; color: #fff;
            font-size: 1rem; outline: none; transition: 0.3s;
        }
        .chat-input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }

        .btn-send {
            padding: 12px 24px; background: linear-gradient(45deg, var(--cyan), #bf00ff);
            border: none; border-radius: 10px; color: #fff; font-family: 'Orbitron';
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-send:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">SPM AI 2050</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="ai-assistant.html" style="color: var(--cyan);">AI Assistant</a>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-header">
            <div class="status-dot"></div>
            <h2>🤖 SPM AI Smart Control</h2>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg bot-msg">
                Hello! Main SPM AI Assistant hoon. Main aapki kya madad kar sakta hoon?<br><br>
                Aap niche diye chips par click kar sakte hain ya apna question type karein!
            </div>
        </div>

        <div class="suggestions">
            <div class="chip" onclick="askQuestion('Coin Rates Kya Hain?')">🪙 Coin Rates?</div>
            <div class="chip" onclick="askQuestion('Host Kaise Bane?')">🏢 Host Kaise Bane?</div>
            <div class="chip" onclick="askQuestion('Mr. Rishi Contact')">📞 Mr. Rishi Contact</div>
            <div class="chip" onclick="askQuestion('Mr. Abhi Contact')">📞 Mr. Abhi Contact</div>
        </div>

        <div class="chat-input-box">
            <input type="text" id="userInput" class="chat-input" placeholder="Apna sawaal yahan likhein..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        function askQuestion(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            // Render User Message
            chatBox.innerHTML += `<div class="msg user-msg">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // AI Logic Response
            setTimeout(() => {
                let response = "Mujhe iska exact answer nahi pata, kripya direct WhatsApp par Mr. Rishi (+91 9329687975) ya Mr. Abhi (+91 7070028414) se contact karein.";
                const query = text.toLowerCase();

                if (query.includes('coin') || query.includes('rate') || query.includes('price')) {
                    response = "🪙 <strong>SPM AI Official Coin Rates:</strong><br>• ₹100 = 1260 Coins<br>• ₹1000 = 12600 Coins<br><br>Buy karne ke liye Home Page par Calculator use karein ya Mr. Rishi ko message karein!";
                } else if (query.includes('host') || query.includes('agency') || query.includes('join')) {
                    response = "🏢 <strong>SPM TOP AGENCY (Code: 100857)</strong> me Host banne ke liye Mr. Abhi (+91 7070028414) se WhatsApp par contact karein. High Targets & Best Commission Support!";
                } else if (query.includes('rishi')) {
                    response = "📞 <strong>Mr. Rishi Contact:</strong><br>WhatsApp: +91 9329687975 (Coin Selling & VIP Support)";
                } else if (query.includes('abhi')) {
                    response = "📞 <strong>Mr. Abhi Contact:</strong><br>WhatsApp: +91 7070028414 (Agency & Hosting Support)";
                }

                chatBox.innerHTML += `<div class="msg bot-msg">${response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
